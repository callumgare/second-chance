# SwiftLint settings. `./sc lint` runs it (with --strict, so a warning
# fails), and so do CI and `./sc release`. See AGENTS.md ("Linting").

included:
  - SecondChance
  - Packages
  - WrappTemplate
  - WrappPuppeteer
  - SecondChanceTests
  - Tools/sc/Sources
  - Tools/sc/Tests

excluded:
  # SwiftPM's checkouts and build products when a package is built on its own.
  - Packages/*/.build
  - Tools/sc/.build
  # Generated: ajv's minified script, as a Swift string (Packages/WrappBuilder/JavaScript/build.sh).
  - Packages/WrappBuilder/Sources/WrappBuilder/Bundles/AjvScript.swift

disabled_rules:
  # Size and complexity metrics: much of the existing code is over them, and
  # bringing it under is refactoring, not something a linter should block.
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - large_tuple
  - nesting
  - type_body_length
  # Trailing commas are used or not as reads best; either is fine.
  - trailing_comma
  # Subprocess output and logs are decoded lossily on purpose
  # (String(decoding:as:)): a stray invalid byte must not lose the line.
  - optional_data_string_conversion
  # TODOs are allowed; they are how known gaps are marked.
  - todo

line_length:
  warning: 180
  ignores_urls: true

identifier_name:
  # Short names (i, x, d, vm) are fine in a small scope.
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]

type_name:
  min_length: 2
  max_length: 60

custom_rules:
  no_print:
    name: "No print()"
    regex: '^\s*print\('
    message: "Log through swift-log instead (AGENTS.md, Code Conventions). sc's own output goes through its terminal UI."
    excluded:
      - "Tools/sc/"
      - "WrappPuppeteer/main.swift"
      # Tests print their own console output on purpose.
      - "SecondChanceTests/"
    severity: error
  no_os_logger:
    name: "No os.Logger"
    regex: '\bos\.Logger\b|\bLogger\(subsystem:'
    message: "Use swift-log's Logger(label:) (AGENTS.md, Code Conventions)."
    excluded:
      # The one place OSLog is written, behind swift-log.
      - "Packages/WrappKit/Sources/WrappLogging/OSLogHandler.swift"
    severity: error
  wine_without_crash_handler:
    name: "Start Wine without our crash handler"
    regex: '\btry\??\s+\w+\.run\(\)'
    message: "Start Wine with runWithoutCrashHandler(), or it inherits Sentry's exception ports and hangs at its third fault (docs/failure-reports.md#child-processes)."
    included:
      - "Packages/WrappKit/Sources/WineKit/"
      - "Packages/SecondChanceKit/Sources/SecondChanceKit/Wine/"
      - "Packages/SecondChanceKit/Sources/SecondChanceKit/Steam/"
    severity: error
  wine_path_outside_library:
    name: "Run Wine through the Wine library"
    regex: '\.binDir\b'
    message: "Start Wine programs with Wine.run, output(of:) or start (Packages/WrappKit/Sources/WineKit/WineProcess.swift) rather than from Wine's own folder; shellExports or WineCommand.commandLine(in:) give it for running by hand."
    excluded:
      - "Packages/WrappKit/Sources/WineKit/"
    severity: error
  no_privacy_annotation:
    name: "No privacy: annotations"
    regex: 'privacy:\s*\.(public|private)'
    message: "swift-log has no privacy annotations; OSLogHandler handles OSLog's (AGENTS.md, Code Conventions)."
    excluded:
      - "Packages/WrappKit/Sources/WrappLogging/OSLogHandler.swift"
    severity: error
