# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/scarlet-hand"
version: 1
title: "Secret of the Scarlet Hand"
series: "Nancy Drew"
series-order: 7
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.scarlet-hand"]

volumes:
  scummvm-saves:
    display-name: "saved games"
  scummvm-settings:
    in-use-when: "never" # only ScummVM's settings
    display-name: "settings"
  wine-documents: # Wine saves from before the game ran in ScummVM
    in-use-when: ["*/*.Hi*Save", "*/*.SAV", "*/HICONTINUE.*"]
    display-name: "saved games from before"

variants:
  - id: "scummvm"
    volumes:
      - { source: "scummvm-saves" } # ScummVM's save path
      - { source: "scummvm-settings" } # its settings file, scummvm.ini

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 31890, common-folder: "Nancy Drew Secret of the Scarlet Hand", exe: "Game.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 5087 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/scarlet-hand.iss"
  her-windows-answer-file: "installer-answer-files/her-download/scarlet-hand.iss"
  quirks:
    - "Runs in ScummVM, which reads the installed data; Wine only installs it."
    - "The disc answer file is copied in but never read, as ScummVM needs no install."
