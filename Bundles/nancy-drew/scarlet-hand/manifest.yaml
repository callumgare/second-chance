# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/scarlet-hand"
version: 1
title: "Secret of the Scarlet Hand"
series: "Nancy Drew"
series-order: 7
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.scarlet-hand"]

variants:
  - id: "scummvm"

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 31890, common-folder: "Nancy Drew Secret of the Scarlet Hand", exe: "Game.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 5087 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/scarlet-hand.iss"
  her-windows-answer-file: "installer-answer-files/her-download/scarlet-hand.iss"
  quirks:
    - "Runs in ScummVM, which reads the installed data; Wine only installs it."
    - "The disc answer file is copied in but never read, as ScummVM needs no install."
