# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/ghost-dogs"
version: 1
title: "Ghost Dogs of Moon Lake"
series: "Nancy Drew"
series-order: 8
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.ghost-dogs"]

volumes:
  scummvm-saves:
    display-name: "saved games"
  scummvm-settings:
    in-use-when: "never" # only ScummVM's settings
    display-name: "settings"
  wine-documents: # Wine saves from before the game ran in ScummVM
    in-use-when: ["*/*.Hi*Save", "*/*.SAV", "*/HICONTINUE.*"]
    display-name: "saved games from before"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31850, common-folder: "Nancy Drew Ghost Dogs of Moon Lake" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 2493 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/ghost-dogs.iss"
  quirks:
    - "Runs in ScummVM, which reads the installed data; Wine only installs it."
    - "The disc answer file is copied in but never read, as ScummVM needs no install."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
