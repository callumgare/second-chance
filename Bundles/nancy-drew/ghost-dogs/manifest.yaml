# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/ghost-dogs"
version: 1
title: "Ghost Dogs of Moon Lake"
series: "Nancy Drew"
series-order: 8
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.ghost-dogs"]

variants:
  - id: "scummvm"

editions:
  - id: "cd"
    source: "disc"
    inputs:
      - { id: "disc-1" }
  - id: "her-windows"
    source: "her-download"
    inputs: [{ id: "installer", format: "windows" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 31850, common-folder: "Nancy Drew Ghost Dogs of Moon Lake", exe: "Game.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 2493 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/ghost-dogs.iss"
  quirks:
    - "Runs in ScummVM, which reads the installed data; Wine only installs it."
    - "The disc answer file is copied in but never read, as ScummVM needs no install."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
