# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/labyrinth-of-lies"
version: 1
title: "Labyrinth of Lies"
series: "Nancy Drew"
series-order: 32
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.labyrinth-of-lies"]

volumes:
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Her Interactive/Labyrinth of Lies/Labyrinth.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
    detect: { codes: ["LIE"] }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 572710, common-folder: "Nancy Drew Labyrinth of Lies", exe: "Labyrinth.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 14014 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
