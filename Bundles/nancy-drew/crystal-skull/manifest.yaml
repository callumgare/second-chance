# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/crystal-skull"
version: 1
title: "Legend of the Crystal Skull"
series: "Nancy Drew"
series-order: 18
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.crystal-skull"]
allow-paths: ["assets/"]                     # its answer files

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31860, common-folder: "Nancy Drew Legend of The Crystal Skull" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 2234 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Game.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - disc: "cd/disc-1"
      installer: "setup.exe"
      files: ["CRYAutoDisk1.exe", "ISSetup.dll", "_setup.dll", "autorun.inf", "data1.cab", "setup.exe", "setup.ini"]

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/crystal-skull.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
