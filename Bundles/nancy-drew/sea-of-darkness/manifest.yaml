# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/sea-of-darkness"
version: 1
title: "Sea of Darkness"
series: "Nancy Drew"
series-order: 33
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.sea-of-darkness"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
    detect: { codes: ["SEA"] }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 572700, common-folder: "Nancy Drew The Sea of Darkness", exe: "SeaOfDarkness.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 18045 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
