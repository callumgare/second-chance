# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/seven-ships"
version: 1
title: "Ransom of the Seven Ships"
series: "Nancy Drew"
series-order: 21
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.seven-ships"]

volumes:                                     # kept outside the app: Application Support/<bundle id>/volumes/
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/Ransom of the Seven Ships/Ransom.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
      - { id: "disc-2" }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 31980, common-folder: "Nancy Drew Ransom of the Seven Ships", exe: "Ransom.exe" }
    # drm left out: not known, so the game is started through Steam

notes:                                       # for people only; nothing reads these
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
