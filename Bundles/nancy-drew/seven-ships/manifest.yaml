# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/seven-ships"
version: 1
title: "Ransom of the Seven Ships"
series: "Nancy Drew"
series-order: 21
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.seven-ships"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31980, common-folder: "Nancy Drew Ransom of the Seven Ships" }
    # drm left out: not known, so the game is started through Steam

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Ransom.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - disc: "cd/disc-1"
      installer: "Setup.msi"
      files: ["Ndc.cab", "PreReq.cab", "RAN1.cab", "Setup.exe", "Setup.msi", "autorun.exe", "autorun.inf"]

notes:
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
