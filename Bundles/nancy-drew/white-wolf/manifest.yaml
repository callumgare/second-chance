# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/white-wolf"
version: 1
title: "The White Wolf of Icicle Creek"
series: "Nancy Drew"
series-order: 17
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.white-wolf"]
allow-paths: ["assets/"]                     # its answer files

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31930, common-folder: "Nancy Drew - The White Wolf of Icicle Creek" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 2435 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Game.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - installed: "cd"
      files: ["Ciftree/", "DirectX/", "Game.exe", "Game.ini", "Nancy.cid", "Ndui.dll", "Sound/", "Video/", "binkw32.dll", "d3dx9_30.dll"]

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/white-wolf.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
