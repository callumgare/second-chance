# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/deadly-device"
version: 1
title: "The Deadly Device"
series: "Nancy Drew"
series-order: 28
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.deadly-device"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Program Files (x86)/Her Interactive/The Deadly Device/DeadlyDevice.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    build: { target: "her-mac" }
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 220420, common-folder: "Nancy Drew - TheDeadlyDevice", exe: "DeadlyDevice.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 5587 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/deadly-device.iss"
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
