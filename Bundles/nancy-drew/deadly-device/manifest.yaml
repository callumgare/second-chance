# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/deadly-device"
version: 1
title: "The Deadly Device"
series: "Nancy Drew"
series-order: 28
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.deadly-device"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 220420, common-folder: "Nancy Drew - TheDeadlyDevice" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 5587 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/deadly-device.iss"
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
