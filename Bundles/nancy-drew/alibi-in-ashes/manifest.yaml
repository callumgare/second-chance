# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/alibi-in-ashes"
version: 1
title: "Alibi in Ashes"
series: "Nancy Drew"
series-order: 26
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.alibi-in-ashes"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 202670, common-folder: "Nancy Drew Alibi in Ashes" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 7313 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Alibi.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - disc: "cd/disc-1"
      installer: "Setup.exe"
      files: ["Alibi.ico", "Setup-1a.bin", "Setup-1b.bin", "Setup.exe", "autorun.inf"]

notes:
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
