# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/waters-edge"
version: 1
title: "Shadow at the Water's Edge"
series: "Nancy Drew"
series-order: 24
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.waters-edge"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
    detect: { aliases: ["shadow waters edge"] }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 200080, common-folder: "Nancy Drew - Shadow Waters Edge" }
    notes:
      drm: "launch-when-steam-running"
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 6327 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Shadow.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
