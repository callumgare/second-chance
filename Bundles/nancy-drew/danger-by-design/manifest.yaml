# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/danger-by-design"
version: 1
title: "Danger by Design"
series: "Nancy Drew"
series-order: 15
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.danger-by-design"]

volumes:
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/Danger by Design/Game.exe", graphics: "direct-draw" } }

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 31800, common-folder: "Nancy Drew Danger by Design", exe: "Game.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 1207 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/danger-by-design.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
