# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/castle-malloy"
version: 1
title: "The Haunting of Castle Malloy"
series: "Nancy Drew"
series-order: 20
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.castle-malloy"]

volumes:
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/The Haunting of Castle Malloy/CastleMalloy.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 31910, common-folder: "Nancy Drew The Haunting of Castle Malloy", exe: "CastleMalloy.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 2699 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
