# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/haunted-carousel"
version: 1
title: "The Haunted Carousel"
series: "Nancy Drew"
series-order: 9
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.haunted-carousel"]
allow-paths: ["assets/"]                     # its answer files

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31820, common-folder: "Nancy Drew The Haunted Carousel" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 2387 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Game.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - disc: "cd/disc-1"
      installer: "Setup.exe"
      files: ["autorun.inf", "CARAuto.exe", "data1.cab", "Nancy.cid", "Setup.exe", "Setup.ini"]
    - installed: "cd"
      files: ["CDSound/", "CDVideo/", "Game.exe", "Nancy.cid", "Setup.exe", "Setup.ini", "ciftree.dat", "readme.txt"]

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/haunted-carousel.iss"
  quirks:
    - "The installer doesn't exit when it is run silently, so AutoIt closes it once the install is done."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
