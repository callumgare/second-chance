# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/secrets-can-kill-remastered"
version: 1
title: "Secrets Can Kill Remastered"
series: "Nancy Drew"
series-order: 2
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.secrets-can-kill-remastered"]

volumes:                                     # kept outside the app: Application Support/<bundle id>/volumes/
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew SCK/Secrets.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
    detect: { aliases: ["nancy drew sck"] }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    build: { target: "her-mac" }
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 42210, common-folder: "Nancy Drew Secrets Can Kill", exe: "Secrets.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 6180 }]

tests:
  scenario: "nancy-drew/quit-from-menu"
  parameters:
    blank-start-takes-click: true   # black for 5 s, then logo and title for 15 s; a click 1.5 s in brings the menu up

notes:                                       # for people only; nothing reads these
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
