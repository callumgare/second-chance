# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/old-clock"
version: 1
title: "Secret of the Old Clock"
series: "Nancy Drew"
series-order: 13
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.old-clock"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31880, common-folder: "Nancy Drew Secret of the Old Clock" }
        launch-mode: # DRM-free, so it can start without Steam
          type: "choice"
          options: ["direct", "steam"]
          default: "direct" # pre-selected; what a headless build takes
          prompt: "How should the game start?"
    notes:
      drm: "no"
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 1297 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/old-clock.iss"
  quirks:
    - "The installer doesn't exit when it is run silently, so AutoIt closes it once the install is done."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
