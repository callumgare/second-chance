# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/blue-moon"
version: 1
title: "Last Train to Blue Moon Canyon"
series: "Nancy Drew"
series-order: 14
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.blue-moon"]
allow-paths: ["assets/"]                     # its answer files

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31810, common-folder: "Nancy Drew Last Train to Blue Moon Canyon" }
    notes:
      drm: "launch-when-steam-running"
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 1111 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Game.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/blue-moon.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
