# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/blue-moon"
version: 1
title: "Last Train to Blue Moon Canyon"
series: "Nancy Drew"
series-order: 14
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.blue-moon"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/Last Train to Blue Moon Canyon/Game.exe", graphics: "direct-draw" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
      - { id: "disc-2" }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 31810, common-folder: "Nancy Drew Last Train to Blue Moon Canyon", exe: "Game.exe" }
    drm: "launch-when-steam-running"
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 1111 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/blue-moon.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
