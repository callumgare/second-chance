# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/shattered-medallion"
version: 1
title: "The Shattered Medallion"
series: "Nancy Drew"
series-order: 31
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.shattered-medallion"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Program Files (x86)/Her Interactive/The Shattered Medallion/Medallion.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
    detect: { codes: ["MED"] }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 572720, common-folder: "Nancy Drew The Shattered Medallion", exe: "Medallion.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 11150 }]

notes:                                       # for people only; nothing reads these
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
