# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/trail-of-the-twister"
version: 1
title: "Trail of the Twister"
series: "Nancy Drew"
series-order: 23
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.trail-of-the-twister"]

volumes:                                     # kept outside the app: Application Support/<bundle id>/volumes/
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/Trail of the Twister/Twister.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
      - { id: "disc-2" }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    build: { target: "her-mac" }
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 42230, common-folder: "Nancy Drew Trail of the Twister", exe: "Twister.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 6262 }]

notes:                                       # for people only; nothing reads these
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
