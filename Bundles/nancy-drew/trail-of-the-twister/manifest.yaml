# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/trail-of-the-twister"
version: 1
title: "Trail of the Twister"
series: "Nancy Drew"
series-order: 23
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.trail-of-the-twister"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 42230, common-folder: "Nancy Drew Trail of the Twister" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 6262 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Twister.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
