# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/shadow-ranch"
version: 1
title: "The Secret of Shadow Ranch"
series: "Nancy Drew"
series-order: 11
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.shadow-ranch"]

volumes:
  wine-documents:
    display-name: "saved games"

variants:
  - id: "wine"
    volumes:
      - { source: "wine-documents", target: "C:/users/crossover/Documents", wine: { drive: "A:" } }
    launch: { wine: { exe: "C:/Nancy Drew/Secret of Shadow Ranch/Game.exe", graphics: "direct-draw" } }

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      inputs:
        game: { type: "steam-game", app-id: 572740, common-folder: "Nancy Drew The Secret of Shadow Ranch", exe: "Game.exe" }
        launch-mode: # DRM-free, so it can start without Steam
          type: "choice"
          options: ["direct", "steam"]
          default: "direct" # pre-selected; what a headless build takes
          prompt: "How should the game start?"
    drm: "no"
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 7041 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/shadow-ranch.iss"
  quirks:
    - "The installer doesn't exit when it is run silently, so AutoIt closes it once the install is done."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
