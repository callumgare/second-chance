# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/shadow-ranch"
version: 1
title: "The Secret of Shadow Ranch"
series: "Nancy Drew"
series-order: 11
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.shadow-ranch"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Nancy Drew/Secret of Shadow Ranch/Game.exe", graphics: "direct-draw" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
    installer: { stubborn: true }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
    installer: { stubborn: true }
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 572740, common-folder: "Nancy Drew The Secret of Shadow Ranch", exe: "Game.exe" }
    drm: "no"
    choices:                                 # DRM-free, so it can start without Steam
      launch-mode:
        options: ["direct", "steam"]
        default: "direct"                    # pre-selected; what a headless build takes
        prompt: "How should the game start?"
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 7041 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/shadow-ranch.iss"
  quirks:
    - "The installer doesn't exit when it is run silently, so AutoIt closes it once the install is done."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
