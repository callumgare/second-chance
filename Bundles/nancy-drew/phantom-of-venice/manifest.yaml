# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/phantom-of-venice"
version: 1
title: "The Phantom of Venice"
series: "Nancy Drew"
series-order: 19
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.phantom-of-venice"]
allow-paths: ["assets/"]                     # its answer files

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31920, common-folder: "Nancy Drew The Phantom of Venice" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 2556 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "PhantomOfVenice.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"
  layouts: # the top level of real discs and installed copies, which its installed signs are checked against
    - disc: "cd/disc-1"  # a whole installed copy of the game sits beside its installer, a folder down
      installer: "setup.exe"
      files: ["ISSetup.dll", "Nancy Drew Central/", "The Phantom of Venice/", "VENAutoDisk1.exe", "autorun.inf", "ciftree/", "sound/", "video2/", "setup.exe", "setup.ini"]

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/phantom-of-venice.iss"
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
