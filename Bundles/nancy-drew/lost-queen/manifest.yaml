# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/lost-queen"
version: 1
title: "Tomb of the Lost Queen"
series: "Nancy Drew"
series-order: 27
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.lost-queen"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Program Files (x86)/Her Interactive/Tomb of the Lost Queen/Tomb.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    inputs:
      - { id: "disc-1" }
  - id: "her-windows"
    source: "her-download"
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 210230, common-folder: "Nancy Drew - Tomb of the Lost Queen", exe: "Tomb.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 8059 }]

notes:                                       # for people only; nothing reads these
  installer: "installshield"
  disc-answer-file: "installer-answer-files/lost-queen.iss"
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
