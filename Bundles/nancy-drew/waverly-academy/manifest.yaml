# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/waverly-academy"
version: 1
title: "Warnings at Waverly Academy"
series: "Nancy Drew"
series-order: 22
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.waverly-academy"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
        disc-2: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 43600, common-folder: "Nancy Drew Warnings at Waverly Academy" }
    notes:
      drm: "launch-when-steam-running"
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 5386 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  quirks:
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
