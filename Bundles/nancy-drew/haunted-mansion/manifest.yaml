# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/haunted-mansion"
version: 1
title: "Message in a Haunted Mansion"
series: "Nancy Drew"
series-order: 4
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.haunted-mansion"]

volumes:
  scummvm-saves:
    display-name: "saved games"
  scummvm-settings:
    in-use-when: "never" # only ScummVM's settings
    display-name: "settings"
  wine-documents: # Wine saves from before the game ran in ScummVM
    in-use-when: ["*/*.Hi*Save", "*/*.SAV", "*/HICONTINUE.*"]
    display-name: "saved games from before"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 615770, common-folder: "Nancy Drew Message in a Haunted Mansion" }
    notes:
      drm: "no"
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 5517 }

installed: [] # ScummVM runs an installed copy's files as it runs the disc's, so one isn't turned down

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  quirks:
    - "Runs in ScummVM, which reads the installed data; Wine only installs it."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
