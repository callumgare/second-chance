# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/captive-curse"
version: 1
title: "The Captive Curse"
series: "Nancy Drew"
series-order: 25
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.captive-curse"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
    detect: { codes: ["CAP"] }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 42220, common-folder: "Nancy Drew The Captive Curse" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 7178 }

installed: # what a folder holding it already installed has: its disc's build can't install from one
  - { file-exists: "Captive.exe" }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  quirks:
    - "Her's Mac download (cider-Nancy…-iso-…dmg) is an image of its Windows and Mac disc, seen only in failure reports: it builds as the disc does, from the Windows installer on it."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
