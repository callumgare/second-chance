# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/captive-curse"
version: 1
title: "The Captive Curse"
series: "Nancy Drew"
series-order: 25
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.captive-curse"]

variants:
  - id: "wine"
    launch: { wine: { exe: "C:/Program Files (x86)/Nancy Drew/The Captive Curse/Captive.exe", graphics: "direct-3d" } }

editions:
  - id: "cd"
    source: "disc"
    build: { target: "disc" }
    inputs:
      - { id: "disc-1" }
    detect: { codes: ["CAP"] }
  - id: "her-windows"
    source: "her-download"
    build: { target: "her-download" }
    inputs: [{ id: "installer", format: "windows" }]
  - id: "her-mac"
    source: "her-download"
    build: { target: "her-mac" }
    inputs: [{ id: "installer", format: "mac" }]
  - id: "steam"
    source: "steam"
    inputs:
      - { id: "game", app-id: 42220, common-folder: "Nancy Drew The Captive Curse", exe: "Captive.exe" }
    # drm left out: not known, so the game is started through Steam
  - id: "big-fish"
    source: "big-fish"
    inputs: [{ id: "game", product: 7178 }]

notes:                                       # for people only; nothing reads these
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
