# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/blackmoor-manor"
version: 1
title: "Curse of Blackmoor Manor"
series: "Nancy Drew"
series-order: 12
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.blackmoor-manor"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 31830, common-folder: "Nancy Drew Curse of Blackmoor Manor" }
    notes:
      drm: "launch-when-steam-running"
  - id: "big-fish"
    source: "big-fish"
    build:
      inputs:
        game: { type: "big-fish-game", product: 1439 }

tests:
  scenario: "nancy-drew/quit-from-menu"

notes:
  installer: "installshield"
  disc-answer-file: "installer-answer-files/blackmoor-manor.iss"
  quirks:
    - "The installer doesn't exit when it is run silently, so AutoIt closes it once the install is done."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
