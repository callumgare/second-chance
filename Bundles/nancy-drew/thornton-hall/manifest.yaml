# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "nancy-drew/thornton-hall"
version: 1
title: "Ghost of Thornton Hall"
series: "Nancy Drew"
series-order: 29
former-bundle-ids: ["au.gare.callum.SecondChance.nancy-drew.thornton-hall"]

volumes:
  wine-documents:
    display-name: "saved games"

editions:
  - id: "cd"
    source: "disc"
    build:
      target: "disc"
      inputs:
        disc-1: { type: "disc" }
    detect: { codes: ["GTH"] }
  - id: "her-windows"
    source: "her-download"
    build:
      target: "her-download"
      inputs:
        installer: { type: "her-download", format: "windows" }
  - id: "her-mac"
    source: "her-download"
    build:
      target: "her-mac"
      inputs:
        installer: { type: "her-download", format: "mac" }
  - id: "steam"
    source: "steam"
    build:
      target: "steam"
      inputs:
        game: { type: "steam-game", app-id: 226820, common-folder: "Nancy Drew The Ghost of Thornton Hall" }
    notes:
      drm: "launch-via-steam-only"
  - id: "big-fish"
    source: "big-fish"
    build:
      target: "big-fish"
      inputs:
        game: { type: "big-fish-game", product: 8778 }

tests:
  scenario: "nancy-drew/quit-from-menu"
  window: "fullscreen"

notes:
  quirks:
    - "Her's Mac download hasn't been looked inside: it is taken to be a Cider build, as Trail of the Twister's is."
    - "Her's Windows download has no answer file, so it installs with its wizard and can't be built headless."
