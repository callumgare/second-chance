# yaml-language-server: $schema=../../manifest.schema.json
format: 1
id: "freeware/tyrian-2000"
version: 1
title: "Tyrian 2000"
display-name: "Tyrian 2000"

volumes:
  dosbox-saves:
    display-name: "saved games"

editions:
  - id: "download"
    source: "download"
    build:
      target: "download"
      inputs:
        game:
          type: "download"
          urls: # OpenTyrian's host; then the 2014 Wayback copy of that URL
            - "https://www.camanis.net/tyrian/tyrian2000.zip"
            - "https://web.archive.org/web/20140616163436id_/http://www.camanis.net/tyrian/tyrian2000.zip"
          sha256: "348bc76e73514e452279b8730cf217daf0f70a282f07b6b94af653d87e921667"
          size: 5051363
          unpack: "zip"
          install: "none"
    licence: "free-release" # its makers gave it away in 2004
    licence-from: "its makers' freeware release, as the OpenTyrian project hosts it"

tests:
  scenario: "dosbox/starts-and-quits"
  window: "fullscreen"

notes:
  about: "Eclipse Software's 1995 shoot-'em-up, in its 1999 Tyrian 2000 edition, freeware since 2004. The first DOSBox program."
  checked: "2026-11-03: the OpenTyrian URL gives the file with this sha256; the 2014 Wayback capture is the same file (CDX digest = its SHA-1)."
