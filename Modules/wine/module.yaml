runtime: { save-warning: true }              # Wine games are less stable than ScummVM's
data: ["routine-errors.yaml"]
# The app's own prefix.yaml, which the prefix stage replaced; and the patch
# functions, which only ran WINE.PATCH: a Wrappfile writes
# WINE.PATCH keep-thread-handles or WINE.PATCH skip-synth-playout itself,
# with a comment saying why it needs it.
retired: ["prefix.yaml", "functions/keep-thread-handles", "functions/skip-synth-playout"]
stages: ["stages/prefix", "stages/update"]  # FROM --module=wine@<version> prefix
functions: ["functions/cnc-ddraw", "functions/prefix-settings"]  # DO wine.cnc-ddraw
assets: ["scenarios/starts-and-quits.yaml"]   # WrappPuppeteer's: a program with no menu, started and quit
updates:
  # A wrapp whose prefix was set up by another prefix stage gets this
  # one's settings run over it (stages/update), keeping the game installed.
  # Not on every release: most only change what happens at launch, which a
  # new wrapp brings anyway. The prefix stage is compared as planned, its
  # functions' steps in it.
  - { id: "wine-prefix", when-changed: ["stages/prefix"] }
build:
  # wine:C:/… — a path on a drive of the game's Windows (its prefix), and a
  # program Wine runs; written C:/… (any drive letter) in a stage that USEs wine.
  path-types:
    wine: { roles: [location, program], short-form: "^[A-Za-z]:([/\\\\].*)?$" }
  instructions:
    # Installs a winetricks verb.
    WINETRICKS: { arguments: { count: 1 }, layer: suggested }
    # The prefix's drives: --only=C: removes every other, C: at drive_c, the
    # rest blocked (Z:, the whole Mac, included).
    DRIVES: { options: { only: value }, required: [only] }
    # Sets (--set <key>:<name> <value>) or removes (--remove <key>:<name>) a
    # registry value.
    REGISTRY: { options: { set: flag, remove: flag }, arguments: { count: "1...2" } }
    # Gives a folder in the prefix a drive, kept for later steps and at launch.
    MOUNT: { options: { cdrom: flag }, arguments: { count: 2, roles: [location, text] } }
    # Lays in the in-process helpers the Mac driver loads.
    HELPERS: {}
    # Changes Wine's own DLLs in the tree's own Wine, each patch by name
    # (docs/modules.md#the-wine-modules-patches): keep-thread-handles (a
    # thread _beginthread started keeps its handle, for Allegro 4's timer)
    # and skip-synth-playout (DirectMusic's synthesiser stops at once, for
    # Game Maker 7's loading).
    PATCH: { arguments: { count: "1...", roles: [text] } }
    # Makes the prefix: wineboot's.
    PREFIX: { layer: suggested }
    # Copies the discs it's given into --into (<into>/disk-<n>), and for more
    # than one merges them into --combined as well, giving each a drive from
    # D: in order: for a game that checks for its disc.
    KEEP-DISCS:
      options: { into: { kind: value, role: location }, combined: { kind: value, role: location } }
      required: [into]
      arguments: { count: "1...", roles: [input] }
      layer: suggested
      may-ask: true                             # disc 2 is asked for when it's needed
  # What USE plans in a tree that doesn't have the module yet.
  setup: [HELPERS, PREFIX]
  # In an old app's tree: its prefix is made already, and wineboot -u over
  # it can wait for ever on Wine's Mono installer. A Wine move runs PREFIX
  # itself (stages/update's caller).
  update-setup: [HELPERS]
  # WATCH --wine.busy: fires when the step's Wine programs use the CPU, or a
  # new one starts.
  watches: [busy]
  core-options:
    # A launch's: what the program draws with (direct-draw, direct-3d or
    # unknown), the log and line that say a non-zero exit was a clean quit,
    # mouse, for a game cnc-ddraw draws: grab-early (the cursor-lock helper
    # has cnc-ddraw take the mouse at the start, or the game's first click
    # is swallowed) or free (it never takes it: devmode, set for the exe, for
    # a game played with the keyboard), window (fullscreen or windowed),
    # overriding what the program asks for when the wrapp gets it wrong,
    # quit-key, the keys the app's Quit presses (key notation: f12:hold=5s, up
    # return*2, escape wait=1s return; 2.5 s between keys unless a gap= or
    # wait= says) in a program that ignores Wine's quit, and quit-confirm-key,
    # the keys a second Quit soon after presses, for a program whose quit key
    # first asks, and
    # fullscreen-setting, where the program keeps its own fullscreen
    # setting (file=,format=,offset=,bytes=,fullscreen=,windowed=), set to
    # the player's choice when they last changed it with the window's
    # fullscreen button, and display-mode (800x600), the display mode set in
    # the program's Wine session before it starts, for a program made for
    # that screen that never sets it itself: Wine emulates it and scales the
    # program's windows up.
    LAUNCH: { graphics: value, clean-exit-log: value, clean-exit-line: value, mouse: value, window: value, quit-key: value, quit-confirm-key: value, fullscreen-setting: value, display-mode: value }
