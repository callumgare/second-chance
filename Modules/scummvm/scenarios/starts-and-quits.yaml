# The simplest test of a ScummVM game: it starts, shows what its bundle's
# `running` needles say it shows, and quits when asked to, as ⌘Q asks.
# The wine module's scenario of the same name, for ScummVM's games
# (docs/testing.md#scenarios).
goal: "program-ends"
timeout: 120
handlers:
  - id: "running"
    when: "running"
    do: ["quit"]
