# yaml-language-server: $schema=../module.schema.json
format: 1
id: "big-fish"
release: 5
native: "big-fish"                           # its Swift: Big Fish's Game Manager, BigFishRuntime, BigFishBuild
versions:
  - { version: "1" }                         # the Game Manager updates itself, so the version is the module's own
depends-on: ["wine@10"]                      # Big Fish's programs run in the wrapp's Wine
stages: ["stages/manager"]                  # FROM --module=big-fish@1 manager
functions: ["functions/install", "functions/cnc-ddraw"]  # DO big-fish.install, DO big-fish.cnc-ddraw
notes:
  about: "A source: a game bought from Big Fish Games, installed and started by Big Fish's Game Manager."
build:
  instructions:
    # Installs Big Fish's Game Manager, from its installer as a fetch mount
    # pinned by its hash, clicked through by AutoIt.
    MANAGER: { options: { mount: repeated }, layer: suggested }
    # Has the Game Manager download, install and activate the input's game
    # (BIG-FISH.INSTALL game --into=…), declining the DirectX setup its
    # installer starts with --decline-directx, and makes --into a link to the
    # folder it installed the game in.
    INSTALL:
      options: { into: { kind: value, role: location }, decline-directx: flag }
      required: [into]
      arguments: { count: 1, roles: [input] }
      may-ask: true
    # Signs the Game Manager out and takes the account out of the prefix:
    # where a layer is worth keeping, as the account is gone.
    SIGN-OUT: { layer: suggested }
  core-options:
    # A launch's: the program Big Fish's DRM starts (--big-fish.exe=C:/…/Game.exe),
    # which the app finds the game's process by.
    LAUNCH: { exe: { kind: value, role: location } }
