# yaml-language-server: $schema=../module.schema.json
format: 1
id: "nancy-drew"
release: 13
versions:
  - { version: "1" }
depends-on: ["wine@10"]                      # its installers and patches run in Wine
data: ["patches.json", "ini.yaml", "clean-exit-log.yaml"]   # each checked against its .schema.json beside it
assets:
  - "assets/installshield-custom-dialog-automate.au3"   # clicks through an installer that won't run silently
  - "assets/her-update-wizard.au3"                       # patchers with no silent mode
  - "assets/update-installation-wizard.au3"
  - "assets/nancy-drew.icns"                             # the games' icon (APP --icon), compiled from nancy-drew.icon by sc generate
  - "assets/nancy-drew.icon"
  - "needles"                                            # WrappPuppeteer's: what its scenario looks for, by tag
  - "scenarios/quit-from-menu.yaml"                      # and the scenario every game's bundle names
allow-paths: ["assets/"]                     # its functions read its AutoIt scripts and icon
functions: ["functions/patch", "functions/configure-ini", "functions/set-icon"]   # DO nancy-drew.<name>
notes:
  about: "What every Nancy Drew game shares: Her Interactive's installers, patches, settings and screens."
